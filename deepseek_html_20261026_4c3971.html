<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спасители Вселенной</title>
<style>
  :root{
    --beige:      #c9a97a;
    --beige-dark: #a9875a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ min-height:100%; }

  /* ---------- Переливающийся белый фон ---------- */
  body{
    font-family: "Georgia", "Times New Roman", serif;
    padding: 36px 18px 70px;
    color: var(--beige);
    background: linear-gradient(125deg,
        #ffffff 0%,  #fdf7ee 15%, #f2f7ff 30%,
        #ffffff 45%, #fffaf2 60%, #f6f9ff 75%,
        #ffffff 90%, #fff6ea 100%);
    background-size: 400% 400%;
    animation: shimmer 20s ease-in-out infinite;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes shimmer{
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* мягкие световые пятна поверх фона */
  body::before{
    content:"";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(circle at 25% 30%, rgba(255,235,200,.65), transparent 42%),
      radial-gradient(circle at 78% 68%, rgba(210,236,255,.65), transparent 42%),
      radial-gradient(circle at 55% 15%, rgba(255,250,235,.80), transparent 50%);
    animation: drift 16s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:0;
  }

  @keyframes drift{
    0%   { transform: translate(0,0) scale(1);       opacity:.75; }
    100% { transform: translate(-4%,3%) scale(1.15); opacity:1;   }
  }

  /* ---------- Заголовок ---------- */
  header{
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 52px;
  }

  h1{
    font-size: clamp(1.7rem, 4vw, 3rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--beige);
    text-shadow:
      0 1px 0 #ffffff,
      0 0 18px rgba(201,169,122,.55),
      0 3px 8px rgba(150,120,80,.30);
  }

  .subtitle{
    margin-top: 14px;
    font-size: .95rem;
    letter-spacing: 2px;
    color: var(--beige-dark);
    text-shadow: 0 1px 0 #fff, 0 0 12px rgba(255,255,255,.9);
  }

  /* ---------- Сетка 3×3 ---------- */
  .grid{
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 46px 34px;
  }

  @media (max-width: 900px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .grid{ grid-template-columns: 1fr; } }

  /* ---------- Карточка ---------- */
  .card{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeUp .9s ease both;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(26px); }
    to  { opacity:1; transform: translateY(0);    }
  }

  /* ---------- Круглая рамка с изображением ---------- */
  .portrait{
    width: 152px;
    height: 152px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #ffffff;
    border: 3px solid rgba(201,169,122,.85);
    box-shadow:
      0 0 0 6px rgba(255,255,255,.95),
      0 0 22px rgba(201,169,122,.75),
      0 10px 26px rgba(150,120,80,.20);
    transition: transform .45s ease, box-shadow .45s ease;
  }

  .portrait:hover{
    transform: scale(1.07);
    box-shadow:
      0 0 0 6px rgba(255,255,255,1),
      0 0 34px rgba(201,169,122,1),
      0 14px 30px rgba(150,120,80,.28);
  }

  /* ---------- Неоновый контур животного ---------- */
  .animal{
    width: 96px;
    height: 96px;
    margin: 16px 0 10px;
    color: var(--c, #999);
    animation: neon 2.6s ease-in-out infinite;
  }

  .animal svg{
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .animal svg .fill{
    fill: currentColor;
    stroke: none;
  }

  @keyframes neon{
    0%,100%{
      filter: drop-shadow(0 0 3px var(--g, var(--c)))
              drop-shadow(0 0 9px var(--g, var(--c)));
    }
    50%{
      filter: drop-shadow(0 0 6px var(--g, var(--c)))
              drop-shadow(0 0 20px var(--g, var(--c)));
    }
  }

  /* ---------- Надписи (бежевые) ---------- */
  .name{
    font-size: 1.12rem;
    font-weight: 700;
    letter-spacing: .6px;
    color: var(--beige);
    text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(150,120,80,.35);
    margin-bottom: 8px;
  }

  .info{
    font-size: .86rem;
    line-height: 1.6;
    color: var(--beige);
    text-shadow: 0 1px 0 #fff, 0 1px 4px rgba(150,120,80,.30);
  }

  .label{
    color: var(--beige-dark);
    font-style: italic;
  }
</style>
</head>
<body>

  <header>

    <p class="subtitle">Девять хранителей · девять стихий · девять печатей</p>

  <main class="grid" id="grid"></main>

<script>

  {
    file: "Do.png", name: "Донатьен Джеймсович Моус",

    animal: "turtle", animalName: "Черепаха", color: "#39ff14"

  {

  },
  {

    animal: "bull", animalName: "Бык", color: "#1e90ff"

  {

  {

    birth: "17 января 2003 г.", death: "3 октября 2026 г.",
    animal: "cat", animalName: "Кот", color: "#262626", glow: "#b9b9b9"
  },
  {
    file: "Ti.png", name: "Тим Бенедиктович Бальтар",
    birth: "23 августа 2003 г.", death: null,
    animal: "dog", animalName: "Собака", color: "#ff8c00"
  },

/* =========================================================
   ОТРИСОВКА
   ========================================================= */
const grid = document.getElementById("grid");

grid.innerHTML = GUARDIANS.map((g, i) => {
  const birthYear = (g.birth.match(/\d{4}/) || [""])[0];
  const deathYear = g.death ? (g.death.match(/\d{4}/) || [""])[0] : null;

  const statusHtml = deathYear
    ? `<p class="info"><span class="label">Годы жизни:</span> ${birthYear} — ${deathYear} гг.</p>`
    : `<p class="info"><span class="label">Статус:</span> жив(а)</p>`;

  const styleVars = `--c:${g.color};` + (g.glow ? `--g:${g.glow};` : "");

  return `
    <article class="card" style="${styleVars} animation-delay:${(i * 0.08).toFixed(2)}s">
      <img class="portrait" src="${g.file}" alt="${g.name}">
      <div class="animal" title="${g.animalName}">${ANIMALS[g.animal]}</div>
      <h2 class="name">${g.name}</h2>
      <p class="info"><span class="label">Дата рождения:</span> ${g.birth}</p>
      ${statusHtml}
    </article>
  `;
}).join("");
</script>
</body>
